; SolHook settings. Everything here is optional: without this file SolHook behaves as Default=Yield.
;
; [Conflicts] -- what to do when somebody else's hook (another Xeno plugin, a third-party DLL) is already at the address
; of one of our hooks:
;   Yield  skip our hook, write the address and the reason to SolHook.log (default)
;   Chain  install ours on top; our "original" becomes the foreign hook, so both work. Only for hooks that call the
;          original; a hook that never does (it replaces the code in place) yields instead, the log says so
;   Ours   install ours and evict the foreign hook (our "original" is the vanilla code); an explicit choice, logged
;   Off    never install this hook (the engine's own code keeps running)
; The most specific entry wins: the exact hook name, then the group (the name up to its first dot), then Default.
; The hook names and what happened to each are in SolHook.log.
[Conflicts]
Default=Yield
;NextDay=Off
;Landing.CanLand=Ours

[Symbols]
;AllowOtherBuild=0
Report=1

; ---- in-game verification mode (2026-10-14): maximum logging ----
; Trace=1        SolHook.log gets "FIRST HIT <hook> @addr +Ns" the second a hook is called for the first time
; DumpEverySec   per-hook call counters (delta + total) every N seconds; at unload: the list of hooks that never fired
; Report=1       every symbol of the table: where it resolved and how
[Safety]
Trace=1
DumpEverySec=10


; who overwrites the engine script-list cell? (change log: old -> new, last hook entered)
[Watch]
A0=0081CC40
A1=00813AE4
A2=0081CC4C
